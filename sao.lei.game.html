<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>极客扫雷</title>
    <style>
        :root {
            --bg: #1e1e1e;
            --panel: #2d2d2d;
            --cell-base: #444;
            --cell-light: #555;
            --cell-dark: #333;
            --cell-open: #1e1e1e;
            --text: #fff;
            --btn: #007aff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            font-family: monospace;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            overflow-x: hidden;
        }

        .panel {
            width: 100%;
            max-width: 400px;
            background: var(--panel);
            padding: 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .stat span { font-size: 0.8rem; color: #aaa; font-weight: normal; margin-bottom: 2px;}

        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            background: #444;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.1s;
        }
        button:active { background: #666; }
        button.mode-flag { background: #e63946; }
        button.mode-dig { background: var(--btn); }

        #game-board {
            display: grid;
            gap: 2px;
            background: var(--cell-dark);
            padding: 4px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .cell {
            width: 32px;
            height: 32px;
            background: var(--cell-base);
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.1s;
        }

        @media (max-width: 400px) {
            .cell { width: 28px; height: 28px; font-size: 1rem; }
        }
        @media (max-width: 330px) {
            .cell { width: 24px; height: 24px; font-size: 0.9rem; }
        }

        .cell:active { background: var(--cell-light); }
        
        .cell.open {
            background: var(--cell-open);
            cursor: default;
        }
        .cell.open:active { background: var(--cell-open); }

        .n1 { color: #00d2ff; }
        .n2 { color: #00e676; }
        .n3 { color: #ffea00; }
        .n4 { color: #ff9100; }
        .n5 { color: #ff1744; }
        .n6 { color: #d500f9; }
        .n7 { color: #fff; }
        .n8 { color: #888; }

        .cell.mine { background: #ff1744 !important; }

        /* 极简版权页脚 */
        .footer {
            margin-top: auto;
            padding-top: 30px;
            padding-bottom: 10px;
            font-size: 11px;
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="panel">
    <div class="stat">
        <span>剩余雷数</span>
        <div id="mine-count">10</div>
    </div>
    
    <div class="controls">
        <button id="btn-mode" class="mode-dig" onclick="toggleMode()">⛏️ 挖雷</button>
        <button onclick="initGame()">🔄 重开</button>
    </div>

    <div class="stat">
        <span>时间</span>
        <div id="timer">0</div>
    </div>
</div>

<div id="game-board"></div>

<div class="footer">
    ©1933保留所有权利
</div>

<script>
    const ROWS = 9;
    const COLS = 9;
    const MINES = 10;

    let board = [];
    let isGameOver = false;
    let isFirstClick = true;
    let isFlagMode = false;
    
    let minesLeft = MINES; 
    let flagsPlaced = 0; 
    let timerInterval = null;
    let timeElapsed = 0;
    let cellsOpened = 0;

    const boardEl = document.getElementById('game-board');
    const mineCountEl = document.getElementById('mine-count');
    const timerEl = document.getElementById('timer');
    const modeBtn = document.getElementById('btn-mode');

    function initGame() {
        clearInterval(timerInterval);
        timeElapsed = 0;
        timerEl.innerText = '0';
        minesLeft = MINES;
        flagsPlaced = 0;
        mineCountEl.innerText = minesLeft;
        isGameOver = false;
        isFirstClick = true;
        cellsOpened = 0;
        board = [];
        
        boardEl.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
        boardEl.innerHTML = '';

        for (let r = 0; r < ROWS; r++) {
            let row = [];
            for (let c = 0; c < COLS; c++) {
                const cell = {
                    isMine: false,
                    isOpen: false,
                    isFlag: false,
                    neighborMines: 0,
                    el: document.createElement('div')
                };
                cell.el.className = 'cell';
                cell.el.onclick = () => handleCellClick(r, c);
                
                boardEl.appendChild(cell.el);
                row.push(cell);
            }
            board.push(row);
        }
    }

    function toggleMode() {
        isFlagMode = !isFlagMode;
        if (isFlagMode) {
            modeBtn.innerText = '🚩 插旗';
            modeBtn.className = 'mode-flag';
        } else {
            modeBtn.innerText = '⛏️ 挖雷';
            modeBtn.className = 'mode-dig';
        }
    }

    function generateMines(firstR, firstC) {
        let minesPlaced = 0;
        while (minesPlaced < MINES) {
            let r = Math.floor(Math.random() * ROWS);
            let c = Math.floor(Math.random() * COLS);
            if (!board[r][c].isMine && (Math.abs(r - firstR) > 1 || Math.abs(c - firstC) > 1)) {
                board[r][c].isMine = true;
                minesPlaced++;
            }
        }
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (!board[r][c].isMine) {
                    let count = 0;
                    for (let i = -1; i <= 1; i++) {
                        for (let j = -1; j <= 1; j++) {
                            let nr = r + i, nc = c + j;
                            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc].isMine) {
                                count++;
                            }
                        }
                    }
                    board[r][c].neighborMines = count;
                }
            }
        }
    }

    function handleCellClick(r, c) {
        if (isGameOver) return;
        const cell = board[r][c];
        if (cell.isOpen) return;

        if (isFlagMode) {
            if (!cell.isFlag) {
                if (flagsPlaced >= MINES) return; 
                
                cell.isFlag = true;
                cell.el.innerText = '🚩';
                flagsPlaced++;
                
                if (cell.isMine) {
                    minesLeft--;
                    mineCountEl.innerText = minesLeft;
                }
            } else {
                cell.isFlag = false;
                cell.el.innerText = '';
                flagsPlaced--;
                
                if (cell.isMine) {
                    minesLeft++;
                    mineCountEl.innerText = minesLeft;
                }
            }
            
            if (minesLeft === 0) {
                isGameOver = true;
                clearInterval(timerInterval);
                autoClearSafeZones();
                setTimeout(() => alert('🎉 牛逼！排雷成功！'), 300);
            }
            return;
        }

        if (cell.isFlag) {
            cell.isFlag = false;
            cell.el.innerText = '';
            flagsPlaced--;
            if (cell.isMine) {
                minesLeft++;
                mineCountEl.innerText = minesLeft;
            }
        }

        if (isFirstClick) {
            generateMines(r, c);
            isFirstClick = false;
            startTimer();
        }

        if (cell.isMine) {
            gameOver(cell);
            return;
        }

        openCell(r, c);
        
        if (cellsOpened === ROWS * COLS - MINES) {
            isGameOver = true;
            clearInterval(timerInterval);
            setTimeout(() => alert('🎉 牛逼！你把安全区全挖开了！'), 100);
        }
    }

    function autoClearSafeZones() {
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (!board[r][c].isMine && !board[r][c].isOpen) {
                    board[r][c].isOpen = true;
                    board[r][c].el.className = 'cell open';
                    if (board[r][c].neighborMines > 0) {
                        board[r][c].el.innerText = board[r][c].neighborMines;
                        board[r][c].el.classList.add(`n${board[r][c].neighborMines}`);
                    }
                }
            }
        }
    }

    function openCell(r, c) {
        if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;
        const cell = board[r][c];
        if (cell.isOpen || cell.isFlag) return;

        cell.isOpen = true;
        cellsOpened++;
        cell.el.className = 'cell open';
        
        if (cell.neighborMines > 0) {
            cell.el.innerText = cell.neighborMines;
            cell.el.classList.add(`n${cell.neighborMines}`);
        } else {
            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {
                    openCell(r + i, c + j);
                }
            }
        }
    }

    function gameOver(clickedCell) {
        isGameOver = true;
        clearInterval(timerInterval);
        clickedCell.el.className = 'cell open mine';
        clickedCell.el.innerText = '💥';
        
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (board[r][c].isMine && !board[r][c].isFlag) {
                    board[r][c].el.innerText = '💣';
                    board[r][c].el.style.background = '#333';
                }
            }
        }
        setTimeout(() => alert('💥 Boom！游戏结束，重新开始吧。'), 100);
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeElapsed++;
            timerEl.innerText = timeElapsed;
        }, 1000);
    }

    initGame();
</script>
</body>
</html>
