<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUPREME GLORY TO 1933</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #000;
    overflow: hidden;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<script>
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');
  
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const letters = 'SUPREME GLORY TO 1933';
  const fontSize = 20;
  let columns = Math.floor(canvas.width / fontSize);
  let drops = [];
  let offsets = [];

  for (let x = 0; x < columns; x++) {
    drops[x] = Math.floor(Math.random() * -30);
    offsets[x] = Math.floor(Math.random() * letters.length);
  }

  function draw() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#00FF00';
    ctx.font = fontSize + 'px monospace';

    for (let i = 0; i < drops.length; i++) {
      let y = drops[i] * fontSize;
      if (y > 0 && y < canvas.height) {
        let charIndex = (drops[i] + offsets[i]) % letters.length;
        if (charIndex < 0) charIndex += letters.length;
        let text = letters.charAt(charIndex);
        ctx.fillText(text, i * fontSize, y);
      }

      if (y > canvas.height && Math.random() > 0.95) {
        drops[i] = 0;
      } else {
        drops[i]++;
      }
    }
  }

  setInterval(draw, 500);

  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    columns = Math.floor(canvas.width / fontSize);
    drops = [];
    offsets = [];
    for (let x = 0; x < columns; x++) {
      drops[x] = Math.floor(Math.random() * -30);
      offsets[x] = Math.floor(Math.random() * letters.length);
    }
  });
</script>
</body>
</html>
