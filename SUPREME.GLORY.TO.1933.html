<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SUPREME GLORY TO 1933</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #000;
    overflow: hidden;
    height: 100vh;
    height: 100dvh;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
  }
  .footer {
    position: absolute;
    bottom: 10px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 11px;
    color: rgba(0, 255, 0, 0.3);
    font-family: monospace;
    z-index: 2;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<div class="footer">©1933保留所有权利</div>

<script>
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');
  
  const letters = 'SUPREME GLORY TO 1933';
  const fontSize = 20;
  let columns;
  let drops = [];
  let offsets = [];
  let timer = null;

  function initCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    columns = Math.floor(canvas.width / fontSize);
    drops = [];
    offsets = [];
    
    for (let x = 0; x < columns; x++) {
      drops[x] = Math.floor(Math.random() * -50);
      offsets[x] = Math.floor(Math.random() * letters.length);
    }
  }

  function draw() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#00FF00';
    ctx.font = fontSize + 'px monospace';

    for (let i = 0; i < drops.length; i++) {
      let y = drops[i] * fontSize;
      if (y > 0 && y < canvas.height) {
        let charIndex = (drops[i] + offsets[i]) % letters.length;
        if (charIndex < 0) charIndex += letters.length;
        let text = letters.charAt(charIndex);
        ctx.fillText(text, i * fontSize, y);
      }

      if (y > canvas.height) {
        if (Math.random() > 0.975) {
          drops[i] = 0;
        }
      } else {
        drops[i]++;
      }
    }
  }

  function startAnimation() {
    if (timer) clearInterval(timer);
    initCanvas();
    timer = setInterval(draw, 500);
  }

  startAnimation();

  window.addEventListener('resize', startAnimation);
</script>
</body>
</html>
