<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1933的二进制转换器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    min-height: 100%;
    background: #1e1e1e;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  body {
    overflow-y: auto;
    overflow-x: hidden;
  }

  #loading-screen {
    position: fixed;
    inset: 0;
    background: #1e1e1e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    z-index: 9999;
    color: #cfcfcf;
    transition: opacity 0.3s ease;
  }

  #loading-screen.hide {
    opacity: 0;
    pointer-events: none;
  }

  .spinner {
    width: 38px;
    height: 38px;
    border: 3px solid #3a3a3a;
    border-top-color: #8a8a8a;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .loading-text {
    font-size: 15px;
    letter-spacing: 2px;
    color: #b5b5b5;
  }

  #main-screen {
    position: relative;
    min-height: 100vh;
    width: 100%;
    background: #1e1e1e;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 32px 24px;
  }

  #title {
    font-size: 26px;
    font-style: italic;
    font-weight: 700;
    letter-spacing: 1px;
    color: #3fbf5f;
    text-align: center;
    margin-bottom: 6px;
  }

  .field {
    width: 100%;
    max-width: 620px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .field-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 4px;
  }

  .field-label {
    font-size: 13px;
    color: #8f8f8f;
    letter-spacing: 1px;
  }

  .btn-group {
    display: flex;
    gap: 8px;
  }

  .mini-btn {
    padding: 4px 12px;
    font-size: 12px;
    color: #b5b5b5;
    background: transparent;
    border: 1px solid #3d3d3d;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }

  .mini-btn:hover {
    background: #333333;
    color: #e8e8e8;
    border-color: #5a5a5a;
  }

  textarea {
    width: 100%;
    height: 150px;
    resize: vertical;
    padding: 14px;
    font-size: 15px;
    line-height: 1.7;
    color: #e8e8e8;
    background: #2a2a2a;
    border: 1px solid #3d3d3d;
    border-radius: 10px;
    outline: none;
    font-family: inherit;
    transition: border-color 0.2s ease, box-shadow 0.3s ease;
    word-break: break-all;
  }

  textarea:focus {
    border-color: #6f6f6f;
  }

  textarea::placeholder {
    color: #7a7a7a;
  }

  textarea.flash {
    border-color: #3fbf5f;
    box-shadow: 0 0 0 2px rgba(63, 191, 95, 0.25);
  }

  #bottom-box {
    font-family: "SFMono-Regular", Consolas, "Courier New", monospace;
    font-size: 14px;
  }

  #convert-btn {
    margin-top: 8px;
    padding: 12px 46px;
    font-size: 15px;
    letter-spacing: 2px;
    color: #e8e8e8;
    background: #3a3a3a;
    border: 1px solid #4a4a4a;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease;
    font-family: inherit;
  }

  #convert-btn:hover {
    background: #4a4a4a;
    border-color: #5c5c5c;
  }

  #convert-btn:active {
    background: #333333;
  }

  #toast {
    position: fixed;
    left: 50%;
    bottom: 48px;
    transform: translateX(-50%) translateY(12px);
    padding: 10px 22px;
    font-size: 14px;
    color: #f0f0f0;
    background: #444444;
    border: 1px solid #5a5a5a;
    border-radius: 8px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    max-width: 86vw;
    text-align: center;
    z-index: 10000;
  }

  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 480px) {
    #title { font-size: 21px; }
    #main-screen { padding: 24px 16px; justify-content: flex-start; padding-top: 40px; }
    textarea { height: 130px; }
    #convert-btn { width: 100%; max-width: 620px; }
  }
</style>
</head>
<body>

  <div id="loading-screen">
    <div class="spinner"></div>
    <div class="loading-text">正在加载</div>
  </div>

  <div id="main-screen">
    <h1 id="title">1933的二进制转换器</h1>

    <div class="field">
      <div class="field-head">
        <span class="field-label">普通文字</span>
        <div class="btn-group">
          <button class="mini-btn copy-btn" data-target="top-box">复制</button>
          <button class="mini-btn clear-btn" data-target="top-box">清空</button>
        </div>
      </div>
      <textarea id="top-box" placeholder="输入普通文字"></textarea>
    </div>

    <div class="field">
      <div class="field-head">
        <span class="field-label">二进制</span>
        <div class="btn-group">
          <button class="mini-btn copy-btn" data-target="bottom-box">复制</button>
          <button class="mini-btn clear-btn" data-target="bottom-box">清空</button>
        </div>
      </div>
      <textarea id="bottom-box" placeholder="输入二进制（如 01001000 01101001，可不加空格）"></textarea>
    </div>

    <button id="convert-btn">转换</button>
  </div>

  <div id="toast"></div>

<script>
  var loading = document.getElementById('loading-screen');
  var main = document.getElementById('main-screen');
  var topBox = document.getElementById('top-box');
  var bottomBox = document.getElementById('bottom-box');
  var convertBtn = document.getElementById('convert-btn');
  var toast = document.getElementById('toast');
  var toastTimer = null;
  var flashTimer = null;
  var loadStart = Date.now();

  function enterMain() {
    var elapsed = Date.now() - loadStart;
    var wait = Math.max(0, 400 - elapsed);
    setTimeout(function () {
      loading.classList.add('hide');
      setTimeout(function () {
        loading.style.display = 'none';
        main.style.display = 'flex';
      }, 300);
    }, wait);
  }

  if (document.readyState === 'complete') {
    enterMain();
  } else {
    window.addEventListener('load', enterMain);
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toast.classList.remove('show');
    }, 2200);
  }

  function flashBox(box) {
    box.classList.add('flash');
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function () {
      box.classList.remove('flash');
    }, 700);
  }

  function copyText(str) {
    if (str === '') {
      showToast('内容为空，无法复制');
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(str).then(function () {
        showToast('已复制到剪贴板');
      }, function () {
        fallbackCopy(str);
      });
    } else {
      fallbackCopy(str);
    }
  }

  function fallbackCopy(str) {
    var temp = document.createElement('textarea');
    temp.value = str;
    temp.style.position = 'fixed';
    temp.style.top = '-9999px';
    temp.style.opacity = '0';
    document.body.appendChild(temp);
    temp.select();
    temp.setSelectionRange(0, str.length);
    var ok = false;
    try {
      ok = document.execCommand('copy');
    } catch (e) {
      ok = false;
    }
    document.body.removeChild(temp);
    showToast(ok ? '已复制到剪贴板' : '复制失败，请手动选择复制');
  }

  function textToBytes(str) {
    var bytes = [];
    for (var i = 0; i < str.length; i++) {
      var code = str.charCodeAt(i);
      if (code < 0x80) {
        bytes.push(code);
      } else if (code < 0x800) {
        bytes.push(0xC0 | (code >> 6), 0x80 | (code & 0x3F));
      } else if (code >= 0xD800 && code <= 0xDBFF && i + 1 < str.length) {
        var next = str.charCodeAt(i + 1);
        if (next >= 0xDC00 && next <= 0xDFFF) {
          var cp = 0x10000 + ((code - 0xD800) << 10) + (next - 0xDC00);
          bytes.push(
            0xF0 | (cp >> 18),
            0x80 | ((cp >> 12) & 0x3F),
            0x80 | ((cp >> 6) & 0x3F),
            0x80 | (cp & 0x3F)
          );
          i++;
        } else {
          bytes.push(0xE0 | (code >> 12), 0x80 | ((code >> 6) & 0x3F), 0x80 | (code & 0x3F));
        }
      } else {
        bytes.push(0xE0 | (code >> 12), 0x80 | ((code >> 6) & 0x3F), 0x80 | (code & 0x3F));
      }
    }
    return bytes;
  }

  function bytesToText(bytes) {
    var result = '';
    var i = 0;
    while (i < bytes.length) {
      var b = bytes[i];
      var cp = 0;
      var extra = 0;
      if (b < 0x80) {
        cp = b;
        extra = 0;
      } else if ((b & 0xE0) === 0xC0) {
        cp = b & 0x1F;
        extra = 1;
      } else if ((b & 0xF0) === 0xE0) {
        cp = b & 0x0F;
        extra = 2;
      } else if ((b & 0xF8) === 0xF0) {
        cp = b & 0x07;
        extra = 3;
      } else {
        return null;
      }
      if (i + extra >= bytes.length) return null;
      for (var j = 1; j <= extra; j++) {
        var nb = bytes[i + j];
        if ((nb & 0xC0) !== 0x80) return null;
        cp = (cp << 6) | (nb & 0x3F);
      }
      i += extra + 1;

      if (cp > 0xFFFF) {
        cp -= 0x10000;
        result += String.fromCharCode(0xD800 + (cp >> 10), 0xDC00 + (cp & 0x3FF));
      } else {
        result += String.fromCharCode(cp);
      }
    }
    return result;
  }

  function textToBinary(str) {
    var bytes = textToBytes(str);
    var parts = [];
    for (var i = 0; i < bytes.length; i++) {
      parts.push(bytes[i].toString(2).padStart(8, '0'));
    }
    return parts;
  }

  function normalizeBinary(str) {
    var compact = str.replace(/\s+/g, '');
    if (compact === '') return [];
    if (!/^[01]+$/.test(compact)) return null;
    if (compact.length % 8 !== 0) {
      var rem = compact.length % 8;
      var need = 8 - rem;
      return { error: '二进制共 ' + compact.length + ' 位，不是 8 的倍数（差 ' + need + ' 位），请检查是否漏字或删掉了空格外的字符' };
    }
    var parts = [];
    for (var i = 0; i < compact.length; i += 8) {
      parts.push(compact.slice(i, i + 8));
    }
    return parts;
  }

  function binaryToText(str) {
    var parts = normalizeBinary(str);
    if (parts === null) {
      return { error: '二进制只能包含 0 和 1' };
    }
    if (parts.error) {
      return { error: parts.error };
    }
    var bytes = [];
    for (var i = 0; i < parts.length; i++) {
      bytes.push(parseInt(parts[i], 2));
    }
    var text = bytesToText(bytes);
    if (text === null) {
      return { error: '二进制字节序列无法按 UTF-8 解码，请确认内容完整' };
    }
    return { text: text };
  }

  function wrapBinary(parts) {
    var lines = [];
    for (var i = 0; i < parts.length; i += 8) {
      lines.push(parts.slice(i, i + 8).join(' '));
    }
    return lines.join('\n');
  }

  var miniBtns = document.querySelectorAll('.mini-btn');
  for (var bi = 0; bi < miniBtns.length; bi++) {
    (function (btn) {
      btn.addEventListener('click', function () {
        var box = document.getElementById(btn.getAttribute('data-target'));
        if (btn.className.indexOf('copy-btn') !== -1) {
          copyText(box.value);
        } else {
          if (box.value === '') {
            box.focus();
            return;
          }
          if (window.confirm('确定清空这个框的内容吗？')) {
            box.value = '';
            box.focus();
          }
        }
      });
    })(miniBtns[bi]);
  }

  convertBtn.addEventListener('click', function () {
    var topVal = topBox.value.trim();
    var bottomVal = bottomBox.value.trim();

    if (topVal !== '' && bottomVal !== '') {
      showToast('上方和下方都有内容，请先清空其中一个');
      return;
    }

    if (topVal === '' && bottomVal === '') {
      showToast('请先输入内容');
      return;
    }

    if (topVal !== '') {
      var parts = textToBinary(topVal);
      bottomBox.value = wrapBinary(parts);
      flashBox(bottomBox);
      showToast('已转换为二进制');
    } else {
      var result = binaryToText(bottomVal);
      if (result.error) {
        showToast(result.error);
        return;
      }
      topBox.value = result.text;
      flashBox(topBox);
      showToast('已转换为文字');
    }
  });
</script>

</body>
</html>
