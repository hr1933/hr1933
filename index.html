<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#121212">
    <title>hr1933 的主页</title>
    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --text: #e0e0e0;
            --link: #4caf50;
            --link-hover: #81c784;
            --border: #333;
        }
        *, *::before, *::after { box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: clamp(10px, 3vw, 20px);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card);
            padding: clamp(16px, 4.5vw, 30px);
            border-radius: clamp(8px, 2.5vw, 12px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            /* 兼容刘海屏 */
            padding-left: max(clamp(16px, 4.5vw, 30px), env(safe-area-inset-left));
            padding-right: max(clamp(16px, 4.5vw, 30px), env(safe-area-inset-right));
        }
        h1 {
            color: #fff;
            font-size: clamp(20px, 5.5vw, 24px);
            line-height: 1.3;
            border-bottom: 2px solid var(--link);
            padding-bottom: 10px;
            margin: 0 0 10px;
        }
        h2 {
            font-size: clamp(16px, 4.5vw, 18px);
            margin: 28px 0 10px;
            color: #fff;
        }
        a {
            color: var(--link);
            text-decoration: none;
            transition: color 0.2s;
            overflow-wrap: anywhere;   /* 关键：长链接自动折行 */
            word-break: break-word;
        }
        a:hover { color: var(--link-hover); text-decoration: underline; }

        ul { padding-left: 20px; margin: 10px 0; }
        li { margin-bottom: 10px; }

        /* 触摸友好：手机上点击区域更大 */
        li a, p a {
            display: inline-block;
            padding: 2px 0;
        }

        hr { border: 0; height: 1px; background: var(--border); margin: 28px 0; }

        .highlight {
            background-color: rgba(76, 175, 80, 0.1);
            border-left: 4px solid var(--link);
            border-radius: 4px;
            margin: 16px 0;
        }
        .highlight a {
            display: block;            /* 整块可点，手机上更好按 */
            padding: 12px 15px;
            font-weight: 500;
        }
        .highlight a:hover { background-color: rgba(76, 175, 80, 0.12); text-decoration: none; }

        /* 小屏微调 */
        @media (max-width: 480px) {
            ul { padding-left: 16px; }
            h2 { margin-top: 24px; }
            .container { box-shadow: 0 2px 12px rgba(0,0,0,0.45); }
            .highlight a { padding: 12px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>欢迎来到 hr1933 的主页</h1>

        <h2>我常用的链接</h2>
        <ul>
            <li>回到我的 <a href="https://github.com/hr1933/hr1933">GitHub 仓库主页</a></li>
            <li>访问我的 <a href="https://github.com/hr1933">GitHub 个人资料</a></li>
            <li>搜索 <a href="https://www.google.com">Google</a></li>
            <li>这里！<a href="https://hr1933.github.io/a/">点击查看1933的作品集</a></li>
            <li>这里！<a href="https://hr1933.github.io/1933/">我的第一个 hello world! 页面</a></li>
        </ul>

        <div class="highlight">
            <a href="SUPREME.GLORY.TO.1933.html">✨ 点此查看演示（适合做屏保）</a>
        </div>

        <p>也可以直接点击链接：<a href="https://github.com/hr1933/hr1933">https://github.com/hr1933/hr1933</a></p>

        <hr>

        <h2>📬 联系我们</h2>
        <p>如有任何问题或合作意向，欢迎通过以下方式联系我：</p>
        <ul>
            <li>发送邮件至 <a href="mailto:hr1933@qq.com">hr1933@qq.com</a></li>
            <li>或直接在 GitHub 上 <a href="https://github.com/hr1933/hr1933/">提交 Issue</a></li>
        </ul>
        <p>期待您的来信！</p>
    </div>
</body>
</html>
